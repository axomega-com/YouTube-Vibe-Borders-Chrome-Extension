<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 260px; margin: 0; padding: 12px; font: 13px/1.5 system-ui, sans-serif; }
      h1 { font-size: 13px; margin: 0 0 8px; }
      .legend { height: 12px; border-radius: 6px;
        background: linear-gradient(90deg, rgb(255,0,40), rgb(128,128,40), rgb(0,255,40)); }
      .legend-row { display: flex; justify-content: space-between; font-size: 11px; color: #666; margin-top: 2px; }
      button { width: 100%; margin-top: 8px; padding: 6px; cursor: pointer; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; margin: 10px 0 0; font-size: 12px; }
      dt { color: #666; }
      dd { margin: 0; }
      .warn { color: #b00; }
    </style>
  </head>
  <body>
    <h1>YouTube Vibe Borders</h1>
    <div class="legend"></div>
    <div class="legend-row"><span>negative 100%</span><span>positive 100%</span></div>
    <p style="margin:6px 0 0;font-size:11px;color:#666;">Negativity also greys and blurs the thumbnail, in proportion.</p>
    <dl>
      <dt>Key</dt><dd id="key"></dd>
      <dt>Model</dt><dd id="model"></dd>
      <dt>Cached</dt><dd id="cache"></dd>
      <dt>This tab</dt><dd id="page"></dd>
    </dl>
    <button id="rescan">Rescan this tab</button>
    <button id="inject">Inject into open YouTube tabs</button>
    <button id="clear">Clear score cache</button>
    <script src="popup.js" type="module"></script>
  </body>
</html>
